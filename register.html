<div class="site-info">
<div class="register-page">

    <div class="register-card">
        <span class="paw-decoration">🐾</span>

        <div class="register-header">
            <img src="pictures/Dr.meow/Dr.Meow.base.png" alt="Dr. Meow">
            <h2>Join the Club 🐾</h2>
            <p>Create your free account and let Dr. Meow guide you</p>
        </div>

        <div id="error-message"></div>

        <div class="reg-input-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="Choose a username">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="reg-input-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="your@email.com">
            <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="reg-input-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="At least 6 characters">
            <i class="fa-solid fa-lock"></i>
        </div>

        <div class="reg-input-group">
            <label for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" placeholder="Repeat your password">
            <i class="fa-solid fa-lock"></i>
        </div>

        <button class="reg-submit-btn" id="register-submit-btn">
            Create Account
        </button>

        <div class="reg-divider">or</div>

        <div class="reg-signin-link">
            Already have an account?
            <button id="go-signin-btn">Sign in here</button>
        </div>
    </div>

</div>
</div>
